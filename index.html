<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ethische Dilemmata im Unterricht – BNE &amp; IDG</title>
<style>
  :root {
    --bg: #ffffff;
    --bg2: #f7f7f6;
    --bg3: #f0efed;
    --border: #e3e2df;
    --border2: #d1d0cc;
    --text: #1a1a18;
    --text2: #5c5b57;
    --text3: #8a8a85;
    --accent: #185FA5;
    --accent-bg: #E6F1FB;
    --radius: 10px;
    --radius-sm: 7px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg2);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  .wrap { max-width: 680px; margin: 0 auto; }

  /* Header */
  .header { margin-bottom: 2rem; }
  .header h1 { font-size: 22px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .header p { font-size: 14px; color: var(--text2); line-height: 1.6; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .pill { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
  .pill-g { background: #E1F5EE; color: #0F6E56; }
  .pill-b { background: #EAF3DE; color: #3B6D11; }

  /* Form card */
  .form-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 1px 4px rgba(0,0,0,.04);
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
  .fg { display: flex; flex-direction: column; gap: 5px; }
  .lbl { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; }
  select, input[type="text"] {
    width: 100%;
    padding: 8px 10px;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    outline: none;
    transition: border-color .15s;
  }
  select:focus, input:focus { border-color: var(--accent); }
  .custom-wrap { margin-bottom: 1rem; display: none; }
  .niveau-row { display: flex; gap: 8px; margin-bottom: 1rem; }
  .nb {
    flex: 1; padding: 8px 4px; font-size: 13px; cursor: pointer;
    border: 1px solid var(--border2); background: var(--bg);
    color: var(--text); border-radius: var(--radius-sm); transition: all .15s;
  }
  .nb:hover { background: var(--bg2); }
  .nb.on { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); font-weight: 600; }
  .gen-btn {
    width: 100%; padding: 10px; font-size: 15px; font-weight: 600; cursor: pointer;
    background: var(--text); color: #fff; border: none;
    border-radius: var(--radius-sm); transition: opacity .15s;
  }
  .gen-btn:hover { opacity: .85; }
  .err {
    background: #FEF2F2; color: #991B1B;
    border-radius: var(--radius-sm); padding: 8px 12px;
    font-size: 13px; margin-top: .75rem; display: none;
  }

  /* Result cards */
  .res { display: none; }
  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
    margin-bottom: .75rem;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .sl { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: .4rem; }
  .dt { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
  .ds { font-size: 14px; color: var(--text2); line-height: 1.75; margin-bottom: 12px; }
  .de {
    background: var(--bg2); border-radius: var(--radius-sm);
    padding: 10px 14px; font-size: 14px; font-style: italic;
    color: var(--text); line-height: 1.6; margin-bottom: 14px;
    border-left: 3px solid var(--border2);
  }
  .tag-row { display: flex; flex-wrap: wrap; gap: 5px; }
  .bx { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
  .bök { background: #EAF3DE; color: #3B6D11; }
  .bso { background: #E6F1FB; color: #185FA5; }
  .böko { background: #FAEEDA; color: #854F0B; }
  .bpo { background: #EEEDFE; color: #534AB7; }
  .bku { background: #FBEAF0; color: #993556; }
  .bidg { background: #E1F5EE; color: #0F6E56; }
  .bw { background: var(--bg2); color: var(--text2); border: 1px solid var(--border); }

  .sep { height: 1px; background: var(--border); margin: 1.25rem 0; }

  /* Impulse */
  .imp-item { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .imp-item:last-child { border-bottom: none; }
  .inum {
    font-size: 10px; font-weight: 700; background: var(--accent-bg); color: var(--accent);
    width: 20px; height: 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
  }
  .itext { font-size: 14px; color: var(--text2); line-height: 1.65; }

  /* Aktionen */
  .ak-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ak { background: var(--bg2); border-radius: var(--radius-sm); padding: 11px 13px; }
  .at { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .ad { font-size: 13px; color: var(--text2); line-height: 1.55; }

  /* Reflexion */
  .rf {
    padding: 7px 0 7px 14px; border-left: 2px solid var(--border2);
    font-size: 14px; color: var(--text2); line-height: 1.65; margin-bottom: 7px;
  }

  /* Navigation */
  .nav { display: flex; gap: 8px; margin-top: 1rem; align-items: center; }
  .nbtn {
    flex: 1; padding: 9px; font-size: 13px; cursor: pointer;
    background: transparent; color: var(--text2);
    border: 1px solid var(--border2); border-radius: var(--radius-sm); transition: background .12s;
  }
  .nbtn:hover { background: var(--bg2); }
  .ctext { font-size: 12px; color: var(--text3); white-space: nowrap; }
  .adapt-note {
    padding: 9px 13px; font-size: 13px; color: var(--text2);
    border-left: 3px solid var(--border2); background: var(--bg2);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0; margin-bottom: .75rem;
  }

  /* Footer */
  .footer { margin-top: 3rem; text-align: center; font-size: 12px; color: var(--text3); }

  @media (max-width: 520px) {
    .row2 { grid-template-columns: 1fr; }
    .ak-grid { grid-template-columns: 1fr; }
    .niveau-row { flex-direction: column; }
  }
</style>
</head>

<div class="wrap">

  <div class="header">

    <label class="lbl">Niveau</label>
    <div class="niveau-row">
      <button class="nb" id="n0" onclick="setN(0)">Grundniveau</button>

      <button class="nb" id="n2" onclick="setN(2)">Hohes Niveau</button>

    <button class="gen-btn" onclick="gen()">Impulse anzeigen ↗</button>
    <div class="err" id="er">Bitte Fach, Klassenstufe und Niveau auswählen.</div>
  </div>

  <div class="res" id="res"></div>

  <div class="footer">
    BNE &amp; IDG Dilemma-Generator · Für den Einsatz im Unterricht

</div>

function onFC() {
  document.getElementById('cw').style.display =
    document.getElementById('fsel').value === 'custom' ? 'block' : 'none';
}
function setN(i) {
  sN = i;
  [0,1,2].forEach(j => document.getElementById('n'+j).classList.toggle('on', j===i));
}
function dCls(d) {
  d = d.toLowerCase();
  if (d.includes('ökon') || d.includes('wirt') || d.includes('digital')) return 'böko';
  if (d.includes('öko') || d.includes('umwelt') || d.includes('natur') || d.includes('ges')) return 'bök';
  if (d.includes('soz') || d.includes('bildung') || d.includes('psych') || d.includes('gesund') || d.includes('inkl')) return 'bso';
  if (d.includes('pol')) return 'bpo';
  if (d.includes('kul') || d.includes('lernen') || d.includes('wissen')) return 'bku';
  return 'bidg';
}
function render(d) {
  const nav = fil.length > 1
    ? `<div class="nav"><button class="nbtn" onclick="nxt()">Nächsten Impuls anzeigen ↗</button><span class="ctext">${idx+1} / ${fil.length}</span></div>`
    : '';
  return `
    <div class="card">
      <div class="dt">${d.ti}</div>
      <div class="ds">${d.sc}</div>
      <div class="de">"${d.eq}"</div>
      <div style="margin-bottom:12px">
        <div class="sl">Nachhaltigkeitsdimensionen</div>
        <div class="tag-row">${d.di.map(x=>`<span class="bx ${dCls(x)}">${x}</span>`).join('')}</div>
      </div>
      <div style="margin-bottom:12px">
        <div class="sl">IDG-Dimensionen</div>
        <div class="tag-row">${d.ig.map(x=>`<span class="bx bidg">${x}</span>`).join('')}</div>
      </div>
      <div>
        <div class="sl">Werte im Fokus</div>
        <div class="tag-row">${d.we.map(x=>`<span class="bx bw">${x}</span>`).join('')}</div>
      </div>
    </div>
    <div class="sep"></div>
    <div class="sl">Impulse für Lehrkräfte — Denken · Beobachten · Einfühlen</div>
    <div class="card">${d.im.map((x,i)=>`<div class="imp-item"><div class="inum">${i+1}</div><div class="itext">${x}</div></div>`).join('')}</div>
    <div class="sep"></div>
    <div class="sl">Schüler:innen ins Tun bringen — niederschwellig &amp; eigenverantwortlich</div>
    <div class="ak-grid">${d.ak.map(a=>`<div class="ak"><div class="at">${a.t}</div><div class="ad">${a.b}</div></div>`).join('')}</div>
    <div class="sep"></div>
    <div class="sl">Reflexionsfragen für Schüler:innen</div>
    <div class="card">${d.re.map(r=>`<div class="rf">${r}</div>`).join('')}</div>
    ${nav}
    <div class="nav" style="margin-top:${fil.length>1?'0':'0.75rem'}">
      <button class="nbtn" onclick="reset()">← Neue Suche</button>
    </div>`;
}
function nxt() { idx = (idx+1) % fil.length; document.getElementById('res').innerHTML = render(fil[idx]); window.scrollTo(0,0); }
function reset() { document.getElementById('res').style.display='none'; document.getElementById('er').style.display='none'; window.scrollTo(0,0); }
function gen() {
  const fv = document.getElementById('fsel').value;
  const kv = document.getElementById('ksel').value;
  if (!fv || !kv || sN < 0) { document.getElementById('er').style.display='block'; return; }
  document.getElementById('er').style.display = 'none';
  const isC = fv === 'custom', nv = NL[sN];
  const mF = d => isC || d.fa.includes(fv);
  const mK = d => d.kl.includes(kv);
  const mN = d => d.ni.includes(nv);
  let r = D.filter(d => mF(d) && mK(d) && mN(d));
  if (!r.length) r = D.filter(d => mF(d) && mK(d));
  if (!r.length) r = D.filter(d => mF(d));
  if (!r.length) r = [...D];
  fil = r.sort(() => Math.random() - .5); idx = 0;
  const rb = document.getElementById('res');
  rb.style.display = 'block';
  rb.innerHTML = (isC ? `<div class="adapt-note">Alle Dilemmata werden angezeigt – sie lassen sich auf "${document.getElementById('cfach').value||'dein Fach'}" übertragen.</div>` : '');
  rb.innerHTML += render(fil[0]);
  window.scrollTo(0, 0);
}
</script>
